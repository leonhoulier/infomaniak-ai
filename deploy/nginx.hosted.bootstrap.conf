# Render the hostname placeholder before installing. This serves ACME only;
# no connection form or API token is accepted over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __INFOMANIAK_AI_HOSTNAME__;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
