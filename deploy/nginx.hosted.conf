# Render hostname and local-port placeholders before installing.
# Exclude IPs, query strings, request bodies and credential headers from access logs.
log_format infomaniak_ai '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name __INFOMANIAK_AI_HOSTNAME__;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://__INFOMANIAK_AI_HOSTNAME__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __INFOMANIAK_AI_HOSTNAME__;

    ssl_certificate /etc/letsencrypt/live/__INFOMANIAK_AI_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__INFOMANIAK_AI_HOSTNAME__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/infomaniak-ai.access.log infomaniak_ai;
    error_log /var/log/nginx/infomaniak-ai.error.log crit;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:__INFOMANIAK_AI_LOCAL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
