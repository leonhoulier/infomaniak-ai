name: infomaniak-ai-hosted
services:
  gateway:
    build: ..
    command: ["node", "dist/server.js", "--hosted"]
    restart: unless-stopped
    read_only: true
    user: "${INFOMANIAK_AI_UID:-1000}:${INFOMANIAK_AI_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      INFOMANIAK_HOSTED_BIND_HOST: 0.0.0.0
      INFOMANIAK_HOSTED_ORIGIN: https://${INFOMANIAK_AI_HOSTNAME:?Set your actual hostname}
      INFOMANIAK_HOSTED_KEY_FILE: /run/secrets/hosted-key
      INFOMANIAK_HOSTED_STATE_DIR: /var/lib/infomaniak-ai-hosted
      INFOMANIAK_HOSTED_DISPOSABLE_DNS_WRITES: ${INFOMANIAK_AI_DISPOSABLE_DNS_WRITES:-true}
      INFOMANIAK_HOSTED_RESOURCE_WRITES: ${INFOMANIAK_AI_RESOURCE_WRITES:-true}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
    volumes:
      - ${INFOMANIAK_AI_HOSTED_PRIVATE_DIR:?Set a private absolute directory}/hosted-key:/run/secrets/hosted-key:ro
      - ${INFOMANIAK_AI_HOSTED_PRIVATE_DIR}/state:/var/lib/infomaniak-ai-hosted
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose: ["8787"]
    networks: [gateway]
  https:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    environment:
      INFOMANIAK_AI_HOSTNAME: ${INFOMANIAK_AI_HOSTNAME:?Set your actual hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [gateway]
    depends_on:
      gateway:
        condition: service_healthy
networks:
  gateway:
volumes:
  caddy_data:
  caddy_config:
